name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - 'main'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3

            - name: Cache Gradle Loom Cache
              uses: actions/cache@v4
              with:
                  path: .gradle/loom-cache
                  key: loom-cache-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', 'fabric/**/build.gradle.kts') }}
                  restore-keys: |
                      loom-cache-${{ runner.os }}

            - name: Build with Gradle
              run: ./gradlew build

            - name: Upload Bukkit jar
              uses: actions/upload-artifact@v4
              with:
                  name: freezeshield-bukkit
                  path: bukkit/build/libs/freezeshield-bukkit-*.jar
                  if-no-files-found: error

            - name: Upload Fabric jar
              uses: actions/upload-artifact@v4
              with:
                  name: freezeshield-fabric
                  path: fabric/build/libs/freezeshield-fabric-*.jar
                  if-no-files-found: error
