# Hulp bij webhooks: https://support.discord.com/hc/nl/articles/228383668
enabled: false
webhook: ""
# Stel in op `true` om de URL-formaatcontrole van Discord te omzeilen.
# Dit staat elke geldige HTTPS-URL toe (handig voor proxy's of Matrix-forwarders).
disable-webhook-validation: false
embed-title: "**Grim Waarschuwing**"
embed-color: "#00FFFF"
include-timestamp: true
# Vervangt backticks (`) in waarden (zoals clientmerken) om te voorkomen dat de tekstopmaak van Discord breekt.
# Stel in op "`" om deze vervanging uit te schakelen.
backtick-replacement-char: "ˋ"
violation-content:
    - "**Speler**: `%player%`"
    - "**Controle**: %check%"
    - "**Overtredingen**: %violations%"
    - "**Client-versie**: %version%"
    - "**Client-merk**: `%brand%`"
    - "**Ping**: %ping%"
    - "**TPS**: %tps%"

# freeze-api Discord bot. When freeze-api is installed, alerts ([webhook] in punishments.yml),
# hacked client detections and automatic bans are posted by its bot instead of the webhook above.
freeze-api:
    enabled: true
    # Channel keys of the freeze-api bot (ANTICHEAT_LOG_CHANNEL_ID / BAN_LOG_CHANNEL_ID in its .env)
    anticheat-channel: "anticheat-log"
    ban-channel: "ban-log"

# Schemamarkers — zie de header-comment in config.yml.
config-flavor: V2
config-version: 1
