# Hilfe zu Webhooks: https://support.discord.com/hc/de/articles/228383668
enabled: false
webhook: ""
# Auf `true` setzen, um die Discord-URL-Formatprüfung zu umgehen.
# Dies erlaubt jede gültige HTTPS-URL (nützlich für Proxys oder Matrix-Forwarder).
disable-webhook-validation: false
embed-title: "**Grim Warnung**"
embed-color: "#00FFFF"
include-timestamp: true
# Ersetzt Backticks (`) in Werten (z. B. Client-Marken), um Fehler in der Discord-Textformatierung zu vermeiden.
# Auf "`" setzen, um diese Ersetzung zu deaktivieren.
backtick-replacement-char: "ˋ"
violation-content:
    - "**Spieler**: `%player%`"
    - "**Überprüfung**: %check%"
    - "**Verstöße**: %violations%"
    - "**Client-Version**: %version%"
    - "**Marke**: `%brand%`"
    - "**Ping**: %ping%"
    - "**TPS**: %tps%"

# freeze-api Discord bot. When freeze-api is installed, alerts ([webhook] in punishments.yml),
# hacked client detections and automatic bans are posted by its bot instead of the webhook above.
freeze-api:
    enabled: true
    # Channel keys of the freeze-api bot (ANTICHEAT_LOG_CHANNEL_ID / BAN_LOG_CHANNEL_ID in its .env)
    anticheat-channel: "anticheat-log"
    ban-channel: "ban-log"

# Schema-Marker — siehe Kopf-Kommentar in config.yml.
config-flavor: V2
config-version: 1
